[project]
name = "urban-building-energy-intelligence"
version = "0.1.0"
description = "Forecasting building energy demand and prioritizing abnormal consumption."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "urban_energy"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
